<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="8.5in" height="11in" viewBox="0 0 850 1100">

  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2f5f"/>
      <stop offset="1" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d62433"/>
      <stop offset="1" stop-color="#b81c2a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1.5" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="850" height="1100" fill="#ffffff"/>

  <!-- ============== TOP BAND ============== -->
  <rect x="0" y="0" width="850" height="58" fill="url(#navyGrad)"/>
  <text x="425" y="29" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="20" letter-spacing="6" fill="#ffffff">
    AMATEUR RADIO · A NATIONAL RESOURCE
  </text>
  <!-- Red separator stripe -->
  <rect x="0" y="58" width="850" height="10" fill="url(#redGrad)"/>

  <!-- ============== HERO ============== -->
  <text x="425" y="110" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="36" letter-spacing="12"
        fill="#0a2540">
    HAM RADIO
  </text>
  <text x="425" y="210" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="108" letter-spacing="2"
        fill="#b81c2a">
    FIELD DAY
  </text>
  <text x="425" y="255" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="36" letter-spacing="12"
        fill="#0a2540">
    ARRL · 2026
  </text>

  <!-- Date strip (two-line) -->
  <rect x="60" y="280" width="730" height="92" rx="6" fill="#0a2540"/>
  <text x="425" y="318" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="32" letter-spacing="3" fill="#ffffff">
    JUNE 27 – 28, 2026
  </text>
  <text x="425" y="354" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="22" letter-spacing="10" fill="#9ab8e0">
    CLEARWATER, FLORIDA
  </text>

  <!-- ============== VISITORS WELCOME callout ============== -->
  <rect x="60" y="392" width="730" height="108" rx="6"
        fill="#fff7d9" stroke="#e2b800" stroke-width="2"/>
  <text x="425" y="424" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="28" letter-spacing="5" fill="#0a2540">
    VISITORS WELCOME · OPEN HOUSE
  </text>
  <text x="425" y="455" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="16" letter-spacing="2" fill="#3a3a3a">
    Free admission  ·  Family-friendly  ·  Indoor, air-conditioned stations
  </text>
  <text x="425" y="484" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="17" letter-spacing="2" fill="#b81c2a">
    No experience required — come ask anything
  </text>

  <!-- ============== WHEN / WHERE ============== -->
  <!-- WHEN column (two phases: SETUP + ON THE AIR) -->
  <text x="100" y="532"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="22" letter-spacing="8" fill="#b81c2a">
    WHEN
  </text>
  <line x1="100" y1="542" x2="180" y2="542" stroke="#b81c2a" stroke-width="3"/>

  <!-- Phase 1: SETUP -->
  <text x="100" y="569"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="11" letter-spacing="5" fill="#b81c2a">
    PHASE 1  ·  SETUP BEGINS
  </text>
  <text x="100" y="592"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="19" fill="#0a2540">
    Sat, June 27  ·  8:00 AM
  </text>
  <text x="100" y="615"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="13" fill="#1a1a1a" font-style="italic">
    <tspan x="100" dy="0">Help raise antennas, run cables —</tspan>
    <tspan x="100" dy="17">or watch a station appear from nothing.</tspan>
  </text>

  <!-- Phase 2: ON THE AIR -->
  <text x="100" y="670"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="11" letter-spacing="5" fill="#b81c2a">
    PHASE 2  ·  ON THE AIR
  </text>
  <text x="100" y="693"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="19" fill="#0a2540">
    Sat 2:00 PM → Sun 2:00 PM
  </text>
  <text x="100" y="710"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="12" fill="#666666" letter-spacing="2">
    24 hours non-stop
  </text>

  <!-- vertical divider -->
  <line x1="425" y1="522" x2="425" y2="715" stroke="#dcdfe5" stroke-width="2"/>

  <!-- WHERE column -->
  <text x="465" y="532"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="22" letter-spacing="8" fill="#b81c2a">
    WHERE
  </text>
  <line x1="465" y1="542" x2="555" y2="542" stroke="#b81c2a" stroke-width="3"/>
  <text x="465" y="578"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="22" fill="#0a2540">
    Clearwater Fire
  </text>
  <text x="465" y="604"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="22" fill="#0a2540">
    Training Center
  </text>
  <text x="465" y="640"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="18" fill="#1a1a1a">
    1716 N. Belcher Road
  </text>
  <text x="465" y="664"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="18" fill="#1a1a1a">
    Clearwater, FL 33765
  </text>
  <text x="465" y="698"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="14" letter-spacing="3" fill="#0a7d4a">
    ← SCAN QR FOR DIRECTIONS
  </text>

  <!-- ============== QR + Operating info ============== -->
  <image x="60" y="720" width="170" height="170"
         xlink:href="qr_em.png" preserveAspectRatio="xMidYMid meet"/>
  <rect x="58" y="718" width="174" height="174" fill="none" stroke="#0a2540" stroke-width="2"/>

  <!-- "What is Field Day" blurb -->
  <text x="255" y="745"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="18" letter-spacing="5" fill="#b81c2a">
    WHAT YOU'LL SEE
  </text>
  <line x1="255" y1="755" x2="355" y2="755" stroke="#b81c2a" stroke-width="3"/>
  <text x="255" y="782"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="15" fill="#1a1a1a">
    <tspan x="255" dy="0">Three HF stations, a 6-meter rig, and a satellite</tspan>
    <tspan x="255" dy="20">station — all running live for 24 hours straight.</tspan>
    <tspan x="255" dy="20">Voice, Morse code, and digital modes.</tspan>
    <tspan x="255" dy="26" font-weight="700">Walk in, ask questions, try a microphone.</tspan>
    <tspan x="255" dy="20">See how amateur radio keeps the country</tspan>
    <tspan x="255" dy="20">connected when other systems fail.</tspan>
  </text>

  <!-- Operating callout (right) -->
  <rect x="640" y="720" width="150" height="170" rx="6" fill="#0a2540"/>
  <text x="715" y="752" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="13" letter-spacing="4" fill="#9ab8e0">
    OPERATING AS
  </text>
  <text x="715" y="800" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="40" letter-spacing="3" fill="#ffffff">
    W4TA
  </text>
  <line x1="670" y1="818" x2="760" y2="818" stroke="#d62433" stroke-width="2"/>
  <text x="715" y="848" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="13" letter-spacing="2" fill="#ffffff">
    CLASS 3A
  </text>
  <text x="715" y="872" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="12" letter-spacing="2" fill="#9ab8e0">
    HF · 6m · SAT
  </text>

  <!-- ============== PRESENTED BY ============== -->
  <line x1="60" y1="895" x2="790" y2="895" stroke="#dcdfe5" stroke-width="2"/>
  <text x="425" y="918" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="14" letter-spacing="10" fill="#666666">
    PRESENTED BY
  </text>

  <!-- 4 logos, alphabetical: CARS, SPARC, UPARC, Wormhole, evenly spaced -->
  <g transform="translate(0,0)">
    <image x="125" y="930" width="100" height="100"
           xlink:href="cars_em.png" preserveAspectRatio="xMidYMid meet"/>
    <image x="293" y="930" width="100" height="100"
           xlink:href="sparc_em.png" preserveAspectRatio="xMidYMid meet"/>
    <image x="461" y="930" width="100" height="100"
           xlink:href="uparc_em.png" preserveAspectRatio="xMidYMid meet"/>
    <image x="629" y="930" width="100" height="100"
           xlink:href="wormhole_em.png" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- ============== FOOTER ============== -->
  <text x="425" y="1055" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="15" letter-spacing="3" fill="#0a2540">
    Questions?  Call or Text  813-205-6388
  </text>
  <text x="425" y="1075" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400" font-size="10" letter-spacing="3" fill="#666666">
    uparc.org   ·   arrl.org/field-day
  </text>
</svg>
